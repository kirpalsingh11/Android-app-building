name: Android Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 --save
      - name: Prepare www
        run: |
          mkdir -p www
          for f in index.html app.js styles.css manifest.json; do [ -f "$f" ] && cp "$f" "www/$f"; done
          test -f www/index.html || exit 1
      - name: Add Android
        run: npx cap add android
      - name: Sync
        run: npx cap copy android && npx cap sync android
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk App.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: App.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: App.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: "Android app. Install directly."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
